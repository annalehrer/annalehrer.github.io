remote_theme: daattali/beautiful-jekyll@6.0.1

title: Anna Lehrer
author: Anna Lehrer

navbar-links:
  Home: ""
  About: "about"
  Work:
    - Live Nation 2024 NFL Draft: "work/live-nation-nfl-draft"
    - Graphic Design Work: "work/graphic-design"
    - Music Matters 2022 Rebrand: "work/music-matters-rebrand"
  Resume: "resume"
  Contact: "contact"

url: "https://annalehrer.github.io"
baseurl: ""

# Avatar in navbar
# avatar: "/assets/images/avatar.jpg"
round-avatar: true

# Social links in footer
social-network-links:
  email: "alehrer@umich.edu"
  linkedin: annalehrer
  instagram: annafrommichigan
  spotify: anna_lehrer

# Colors
navbar-col: "#a0382a"
navbar-text-col: "#ffffff"
navbar-border-col: "#8b2500"
page-col: "#ffffff"
text-col: "#2c2c2c"
link-col: "#a0382a"
hover-col: "#8b2500"
footer-col: "#2c2c2c"
footer-text-col: "#cccccc"
footer-link-col: "#f5e1b8"
footer-hover-col: "#ffffff"

# General
title-on-all-pages: true
excerpt_length: 50
post_search: false

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: "page"

# Build
timezone: "America/New_York"
markdown: kramdown
permalink: pretty

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-remote-theme

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
